services:
  postgres:
    image: postgres:16-alpine
    container_name: fiszki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fiszki
      POSTGRES_PASSWORD: fiszki_password
      POSTGRES_DB: fiszki
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiszki -d fiszki"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: fiszki_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fiszki:fiszki_password@postgres:5432/fiszki?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_change_me_refresh_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 4000
      NODE_ENV: production
      # This compose file is the local-development entrypoint, so the
      # brute-force limiter is deliberately loose here (all traffic arrives
      # from one Docker gateway IP, so a strict cap locks out the whole
      # machine). Lower this to ~10 for a real deployment.
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: fiszki_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
