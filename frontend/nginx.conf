server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Uwaga przy edycji: add_header w bloku location ZASTĘPUJE wszystkie
    # nagłówki odziedziczone z poziomu server, więc poniższe trzeba powtórzyć
    # w każdej lokalizacji, która dodaje własne.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html musi być sprawdzany przy każdym wejściu. Jego treść wskazuje
    # na zahaszowane pliki /assets/..., więc przeglądarka trzymająca starą
    # kopię uruchamia starą wersję aplikacji mimo wdrożenia nowej — łącznie
    # ze starym adresem API wkompilowanym w bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Pliki w /assets/ mają hash w nazwie, więc nowa wersja to nowa nazwa —
    # można je cache'ować bezterminowo.
    location /assets/ {
        # Bez dyrektywy expires — generowałaby drugi, nadmiarowy nagłówek
        # Cache-Control obok tego poniżej.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
